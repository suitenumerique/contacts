#
# contacts package
#
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "contacts"
version = "0.1.0"
authors = [{ "name" = "anct", "email" = "contact@suite.anct.gouv.fr" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
description = "A contacts application for La Suite."
keywords = ["Django", "Contacts", "Address book"]
requires-python = ">=3.14.7,<4.0"
dependencies = [
    "Brotli==1.2.0",
    "defusedxml==0.7.1",
    "dj-database-url==3.0.1",
    "dramatiq[redis]==1.17.1",
    "django==5.2.17",
    "django-dramatiq==0.12.0",
    "django-configurations==2.5.1",
    "django-fernet-encrypted-fields>=0.2",
    "django-cors-headers==4.9.0",
    "django-lasuite[configuration,oidc-login,oidc-resource-server]==1.1.0",
    "django-redis==6.0.0",
    "djangorestframework==3.17.2",
    "drf_spectacular==0.29.0",
    "drf-standardized-errors==0.15.0",
    "gunicorn==25.1.0",
    "mozilla-django-oidc==4.0.1",
    "phonenumberslite==9.0.40",
    "psycopg[binary]==3.3.3",
    "redis<6.0.0",
    "requests==2.34.2",
    "sentry-sdk==2.53.0",
    "vobject==0.9.9",
    "whitenoise==6.11.0",
]

[project.urls]
"Bug Tracker" = "https://github.com/suitenumerique/contacts/issues/new"
"Changelog" = "https://github.com/suitenumerique/contacts/blob/main/CHANGELOG.md"
"Homepage" = "https://github.com/suitenumerique/contacts"
"Repository" = "https://github.com/suitenumerique/contacts"

[project.optional-dependencies]
dev = [
    "cryptography==50.0.1",
    "django-debug-toolbar==6.1.0",
    "django-extensions==4.1",
    "drf-spectacular-sidecar==2026.1.1",
    "factory_boy==3.3.3",
    "faker==39.0.0",
    "ipdb==0.13.13",
    "ipython==9.7.0",
    "pip-audit==2.9.0",
    "pyfakefs==5.10.2",
    "pylint-django==2.7.0",
    "pylint==4.0.4",
    "pytest-cov==7.0.0",
    "pytest-django==4.11.1",
    "pytest==9.0.3",
    "pytest-icdiff==0.9",
    "pytest-xdist==3.8.0",
    "responses==0.25.8",
    "ruff==0.15.2",
    "types-requests==2.32.4.20250913",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["contacts*", "core*", "carddav*"]
exclude = ["*.tests", "*.tests.*"]

[tool.ruff]
exclude = [
    ".git",
    ".venv",
    "build",
    "venv",
    "__pycache__",
    "*/migrations/*",
]
line-length = 88


[tool.ruff.lint]
ignore = ["DJ001", "PLR2004"]
select = [
    "B", # flake8-bugbear
    "BLE", # flake8-blind-except
    "C4", # flake8-comprehensions
    "DJ", # flake8-django
    "I", # isort
    "PLC", # pylint-convention
    "PLE", # pylint-error
    "PLR", # pylint-refactoring
    "PLW", # pylint-warning
    "RUF100", # Ruff unused-noqa
    "RUF200", # Ruff check pyproject.toml
    "S", # flake8-bandit
    "SLF", # flake8-self
    "T20", # flake8-print
]

[tool.ruff.lint.isort]
section-order = ["future","standard-library","django","third-party","contacts","first-party","local-folder"]
sections = { contacts=["core"], django=["django"] }
extra-standard-library = ["tomllib"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S", "SLF"]
# Local imports breaking circular dependencies (models <-> api).
"core/api/permissions.py" = ["PLC0415"]
# Signal receivers must be imported from ready(), not at module import time.
"carddav/apps.py" = ["PLC0415"]

[tool.pytest.ini_options]
addopts = [
    "-v",
    "--cov-report",
    "term-missing",
    # Allow test files to have the same name in different directories.
    "--import-mode=importlib",
]
python_files = [
    "test_*.py",
    "tests.py",
]
