{% extends "admin/change_form.html" %}
{% load static %}

{% block extrahead %}
  {{ block.super }}
  <script src="{% static 'core/admin/confirm_submit.js' %}" defer></script>
{% endblock %}

{% block object-tools-items %}
  {% if original.pk %}
    <li>
      <form action="{% url 'admin:core_channel_rotate_token' original.pk %}"
            method="post"
            style="display:inline;"
            data-confirm="Rotate the key of this channel? The current key stops working immediately.">
        {% csrf_token %}
        <button type="submit" class="historylink" style="cursor:pointer;border:0;">
          Rotate key
        </button>
      </form>
    </li>
  {% endif %}
  {{ block.super }}
{% endblock %}
